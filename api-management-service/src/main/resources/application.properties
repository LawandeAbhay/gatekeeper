spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper_management
spring.datasource.username=root
spring.datasource.password=root
# Display SQL queries
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# Show SQL parameter values (Hibernate 6)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
security.jwt.secret=getaklrfghksdhfi-dfgkdjgkk-dfgjh-dfghjrthjk

gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}
